<!doctype html>
<html><head><meta charset="utf-8"><title>phone frame</title></head>
<body style="margin:0;background:#888">
<!-- phone.html?p=/learn/fluids/f-pumps&dark=1 : shows the app in a 375px frame for screenshots -->
<iframe id="f" style="width:375px;height:1400px;border:0;display:block;background:#fff"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.src = '../index.html#' + (q.get('p') || '/');
  if (q.get('dark')) f.onload = () => f.contentDocument.documentElement.setAttribute('data-theme', 'dark');
</script>
</body></html>
