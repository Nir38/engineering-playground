<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram gallery</title>
<link rel="stylesheet" href="../css/style.css">
<style>body{padding:8px} .g{display:grid;grid-template-columns:1fr 1fr;gap:8px} .g div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px} .g b{font-size:11px}</style>
</head>
<body>
<!-- gallery.html?only=tackle,atwood shows a subset; no query shows every diagram -->
<div class="g" id="g"></div>
<script type="module">
  import { registry } from '../js/diagrams.js';
  const args = {
    beam: ['ss-udl', { diagrams: true }], section: ['I', {}], stressElement: [100, 0, 40], mohrCircle: [80, 20, 30],
    goodman: [250, 500, 350, 150, 100], floating: [{ frac: 0.6 }], pipeContraction: [{ venturi: true }],
    moody: [{ point: [1e5, 0.0218] }], ironCarbon: [{ c0: 0.4 }], heatTreat: ['qt'],
    bars: [{ data: [['a', 1], ['b', 2]], label: 'x' }], tackle: [4], twoCables: [30],
  };
  const only = new URLSearchParams(location.search).get('only');
  const names = only ? only.split(',') : Object.keys(registry);
  document.getElementById('g').innerHTML = names.map((fn) => `<div><b>${fn}</b>${registry[fn](...(args[fn] || []))}</div>`).join('');
</script>
</body>
</html>
