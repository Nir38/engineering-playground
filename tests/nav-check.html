<!doctype html>
<html><head><meta charset="utf-8"><title>navigation check</title></head>
<body style="margin:0;font:13px system-ui">
<!-- Drives the real app in a phone-size iframe through every screen transition
     and checks that buttons still respond afterwards. Result goes into the "out" block. -->
<pre id="out">running…</pre>
<iframe id="f" style="width:375px;height:800px;border:0"></iframe>
<script type="module">
  const out = document.getElementById('out'), fr = document.getElementById('f');
  const log = [];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let W, D;
  const $ = (s) => D.querySelector(s);
  const go = async (h) => { W.location.hash = h; await sleep(200); };
  const check = (name, cond, info = '') => log.push(`${cond ? 'PASS' : 'FAIL'} ${name}${cond || !info ? '' : ' (' + info + ')'}`);
  const qIndex = () => { const t = $('.qhead .small'); return t ? t.textContent.trim() : ''; };
  async function answerCurrent() {
    if ($('.option:not([disabled])')) { $('.option:not([disabled])').click(); }
    else if ($('#num') && !$('#num').disabled) { $('#num').value = '1'; $('#check').click(); }
    else if ($('#reveal')) { $('#reveal').click(); await sleep(50); $('#selfGood').click(); }
    await sleep(150);
    return !!$('#nextQ');
  }

  window.onerror = (m, src, line) => { out.textContent = `ERROR ${m} @${line}\n${log.join('\n')}`; };
  try {
  fr.src = '../index.html#/';
  await new Promise((r) => (fr.onload = r));
  await sleep(500);
  W = fr.contentWindow; D = fr.contentDocument;
  W.confirm = () => true; W.prompt = () => null;
  try { W.localStorage.clear(); } catch (e) {}

  // 1. start a quiz from home, answer, go to the lesson, come back
  await go('#/');
  $('#quick10').click(); await sleep(300);
  check('home → quick quiz opens question 1', qIndex() === '1/10');
  check('question 1 can be answered', await answerCurrent());
  const lessonLink = [...D.querySelectorAll('#after a')].find((a) => a.textContent.includes('לחומר'));
  lessonLink.click(); await sleep(300);
  check('"לחומר" opens the lesson', W.location.hash.startsWith('#/learn/'));
  check('lesson shows "back to quiz" bar', !!$('.resume-banner'));
  $('.resume-banner').click(); await sleep(300);
  check('bar returns to the quiz', W.location.hash === '#/quiz/run' && qIndex() === '1/10');
  check('answered question shows its feedback on return', !!$('#fb .feedback') && !!$('#nextQ'));
  $('#nextQ').click(); await sleep(250);
  check('"next" works after returning (question 2)', qIndex() === '2/10');
  check('question 2 accepts an answer after returning', await answerCurrent());

  // 2. browser back from lesson to quiz
  [...D.querySelectorAll('#after a')].find((a) => a.textContent.includes('לחומר')).click(); await sleep(300);
  W.history.back(); await sleep(400);
  check('browser back returns to the quiz', W.location.hash === '#/quiz/run' && qIndex() === '2/10');
  $('#nextQ').click(); await sleep(250);
  check('"next" works after browser back (question 3)', qIndex() === '3/10');

  // 3. leave an UNANSWERED question for another tab, then come back and answer
  await go('#/progress');
  await go('#/');
  check('home shows "back to quiz" bar during a quiz', !!$('.resume-banner'));
  $('.resume-banner').click(); await sleep(300);
  check('unanswered question 3 still answerable', qIndex() === '3/10' && (await answerCurrent()));

  // 4. finish the quiz
  for (let k = 0; k < 12 && $('#nextQ'); k++) { $('#nextQ').click(); await sleep(200); if ($('#nextQ')) break; await answerCurrent(); }
  while ($('#nextQ')) { $('#nextQ').click(); await sleep(200); if (!$('#nextQ')) await answerCurrent(); }
  check('quiz reaches the summary', !!$('.score-ring'));
  check('no "back to quiz" bar after finishing', (await go('#/'), !$('.resume-banner')));
  W.history.back(); await sleep(300);
  check('back from summary does not crash', !!$('#view').children.length);

  // 5. trivia: leave mid-question and return, timer restarts, still answerable
  await go('#/');
  $('#trivia').click(); await sleep(300);
  check('trivia shows timer', !!$('#timer'));
  await go('#/learn');
  await sleep(1200);
  $('.resume-banner') && $('.resume-banner').click(); await sleep(300);
  check('trivia question answerable after returning', await answerCurrent());
  { const t1 = $('#timer')?.textContent; await sleep(1300); check('trivia timer stopped after answer', !!t1 && $('#timer')?.textContent === t1); }

  // 6. quit with ✕
  $('#quit').click(); await sleep(300);
  check('✕ leaves the quiz to the builder', W.location.hash === '#/quiz');
  check('no bar after quitting', !$('.resume-banner'));

  // 7. builder → topic quiz; lesson "practice" button; report sheet
  [...D.querySelectorAll('input[type=checkbox]')].slice(0, 2).forEach((c) => c.click());
  $('#go').click(); await sleep(300);
  check('builder starts a quiz', W.location.hash === '#/quiz/run' && /^1\//.test(qIndex()));
  await answerCurrent(); $('#report').click(); await sleep(100);
  check('report sheet opens', !D.getElementById('modal').hidden);
  $('#cancel').click(); await sleep(100);
  check('report sheet closes', D.getElementById('modal').hidden);
  check('"next" works after the report sheet', ($('#nextQ').click(), await sleep(200), /^2\//.test(qIndex())));
  await go('#/learn/strength/pulleys');
  check('pulleys lesson exists', !!$('#practice'));
  $('#practice').click(); await sleep(300);
  check('lesson "practice" replaces the quiz with a topic quiz', /^1\//.test(qIndex()));

  // 8. every lesson opens, neighbour links work, every domain list opens
  const lessons = [...new Set([...D.querySelectorAll('a')].map((a) => a.getAttribute('href')))];
  await go('#/learn');
  const domainLinks = [...D.querySelectorAll('a.list-item')].map((a) => a.getAttribute('href'));
  let okDomains = true, okLessons = true, okNext = true;
  for (const h of domainLinks) {
    await go(h); const subs = [...D.querySelectorAll('a.list-item')].map((a) => a.getAttribute('href'));
    if (!subs.length) okDomains = false;
    for (const sh of subs) {
      await go(sh);
      if (!$('#practice') || !$('.eq')) okLessons = false;
      const next = [...D.querySelectorAll('.btn-row a.btn')].find((a) => a.textContent.includes('←'));
      if (next) { const target = next.getAttribute('href'); next.click(); await sleep(150); if (W.location.hash !== target) okNext = false; }
    }
  }
  check(`every domain opens (${domainLinks.length})`, okDomains && domainLinks.length >= 3);
  check('every lesson renders equations and a practice button', okLessons);
  check('"next lesson" links work', okNext);

  // 9. search and theme
  await go('#/search');
  const inp = $('#q'); inp.value = 'גלגלת'; inp.dispatchEvent(new W.Event('input')); await sleep(100);
  check('search finds the pulleys lesson', [...D.querySelectorAll('#res a')].some((a) => a.getAttribute('href').endsWith('/pulleys')));
  const before = D.documentElement.getAttribute('data-theme'); $('#themeBtn').click(); await sleep(50);
  check('theme button switches theme', D.documentElement.getAttribute('data-theme') !== before);

  // 10. playground
  await go('#/play');
  $('[data-mode="beam"]').click(); await sleep(80);
  check('playground tab opens and is marked active', !!$('#pgCanvas') && $('.tabbar a.active')?.dataset.tab === 'play');
  $('[data-tpl="ss"]').click(); await sleep(80);
  check('simply supported template: determinate, R = 30 kN', $('#pgResults .pg-status.good') && $('#pgResults').textContent.includes('Ry = 30 kN'));
  $('[data-add="point"]').click(); await sleep(80);
  check('adding a force opens its editor', $('#pgEdit h3')?.textContent.includes('כוח נקודתי'));
  const g = $('#pgCanvas .pg-sel'), r0 = g.getBoundingClientRect(), xBefore = $('#pgEdit [data-f="x"]').value;
  const pe = (type, el, x) => el.dispatchEvent(new W.PointerEvent(type, { bubbles: true, clientX: x, clientY: r0.top + r0.height / 2, pointerId: 7, isPrimary: true }));
  pe('pointerdown', g.querySelector('.pg-hit'), r0.left + r0.width / 2); pe('pointermove', $('#pgCanvasWrap'), r0.left + r0.width / 2 + 60); await sleep(80);
  pe('pointerup', $('#pgCanvasWrap'), r0.left + r0.width / 2 + 60); await sleep(80);
  const xAfter = $('#pgEdit [data-f="x"]').value;
  check('dragging moves the force to the right', parseFloat(xAfter) > parseFloat(xBefore), `${xBefore} -> ${xAfter}`);
  const inpP = $('#pgEdit [data-f="P"]'); inpP.value = '50'; inpP.dispatchEvent(new W.Event('input', { bubbles: true })); await sleep(80);
  check('typing a force value updates the results', $('#pgResults').textContent.includes('Ry') && $('#pgCanvas').textContent.includes('50 kN'));
  $('#pgEdit [data-act="del"]').click(); await sleep(80);
  check('delete removes the force', !$('#pgCanvas').textContent.includes('50 kN') && $('#pgEdit h3')?.textContent.includes('הקורה'));
  $('[data-tpl="empty"]').click(); await sleep(50); $('[data-add="roller"]').click(); await sleep(50); $('[data-add="roller"]').click(); await sleep(50);
  check('two rollers are reported as a mechanism', !!$('#pgResults .pg-status.bad'));
  $('[data-tpl="prop"]').click(); await sleep(50); await go('#/learn'); await go('#/play');
  check('the scene is kept after leaving the tab', $('#pgResults .pg-status.warn') && $('#pgResults').textContent.includes('22.5 kN'));

  // 11. playground: pulleys
  $('[data-mode="pulley"]').click(); await sleep(100);
  $('[data-act="sub"][data-v="hoist"]').click(); await sleep(60);
  check('pulley mode shows the hoist', !!$('#pgHoist') && !$('#pgCanvas'));
  const n0 = Number($('#pgN').textContent); $('[data-act="n"][data-v="1"]').click(); await sleep(60);
  check('hoist "+" adds a rope segment', Number($('#pgN').textContent) === Math.min(6, n0 + 1));
  const eta = $('#pgPulEdit [data-f="eta"]'); eta.value = '1'; eta.dispatchEvent(new W.Event('input', { bubbles: true })); await sleep(60);
  const nn = Number($('#pgN').textContent), m = parseFloat($('#pgPulEdit [data-f="m"]').value), mb = parseFloat($('#pgPulEdit [data-f="mb"]').value);
  const Fshown = parseFloat($('#pgPulResults .pg-max b').textContent);
  check('ideal hoist shows F = W/n', Math.abs(Fshown - (m + mb) * 9.81 / nn) < 0.01 * Fshown, `${Fshown} vs ${(m + mb) * 9.81 / nn}`);
  const hd = $('#pgHoist [data-hand] .pg-hit'), hr = hd.getBoundingClientRect();
  const pe2 = (type, el, y) => el.dispatchEvent(new W.PointerEvent(type, { bubbles: true, clientX: hr.left + hr.width / 2, clientY: y, pointerId: 9, isPrimary: true }));
  pe2('pointerdown', hd, hr.top + hr.height / 2); pe2('pointermove', $('#pgPulCanvas'), hr.top + hr.height / 2 + 40); pe2('pointerup', $('#pgPulCanvas'), hr.top + hr.height / 2 + 40); await sleep(80);
  check('dragging the hand pulls rope and lifts the load', /משכת ⁦(?!0 m)/.test($('#pgHoist').textContent));
  $('[data-act="sub"][data-v="conn"]').click(); await sleep(60); $('[data-tpl="atwood"]').click(); await sleep(60);
  check('Atwood 2 kg / 3 kg: a = 1.962 m/s²', !!$('#pgConn') && $('#pgPulResults').textContent.includes('1.962 m/s'));
  $('[data-tpl="table"]').click(); await sleep(60);
  const mR = $('#pgPulEdit [data-f="mR"]'); mR.value = '1'; mR.dispatchEvent(new W.Event('input', { bubbles: true })); await sleep(60);
  check('light hanging mass on a rough table stays at rest', $('#pgPulResults .pg-status')?.textContent.includes('במנוחה'));
  await go('#/learn'); await go('#/play');
  check('the pulley mode and scene are kept', !!$('#pgConn') && $('[data-mode="pulley"]').getAttribute('aria-pressed') === 'true');
  $('[data-mode="beam"]').click(); await sleep(80);
  check('switching back to beams works', !!$('#pgCanvas') && !$('#pgConn'));

  // 12. playground: trusses
  $('[data-mode="truss"]').click(); await sleep(100);
  $('[data-tpl="pratt"]').click(); await sleep(80);
  check('Pratt template: determinate, top chord 16.67 kN', $('#pgTrussRes .pg-status.good') && $('#pgTrussRes').textContent.includes('16.67'));
  // build a triangle by tapping the grid with the member tool (world m -> screen via the svg matrix)
  const tap = (x, y) => {
    const sv = $('#pgTruss'), p = sv.createSVGPoint(); p.x = 24 + 26 * x; p.y = 210 - 26 * y;
    const q = p.matrixTransform(sv.getScreenCTM());
    const o = { bubbles: true, clientX: q.x, clientY: q.y, pointerId: 11, isPrimary: true };
    $('#pgTrussCanvas').dispatchEvent(new W.PointerEvent('pointerdown', o)); $('#pgTrussCanvas').dispatchEvent(new W.PointerEvent('pointerup', o));
  };
  $('[data-tpl="empty"]').click(); await sleep(60);
  $('[data-tool="member"]').click(); await sleep(40);
  for (const [x, y] of [[1, 1], [7, 1], [4, 4], [1, 1]]) { tap(x, y); await sleep(40); }
  $('[data-tool="pin"]').click(); await sleep(40); tap(1, 1); await sleep(40);
  $('[data-tool="roller"]').click(); await sleep(40); tap(7, 1); await sleep(40);
  $('[data-tool="force"]').click(); await sleep(40); tap(4, 4); await sleep(60);
  const rowsT = D.querySelectorAll('#pgTrussRes tbody tr').length;
  check('tapping builds a triangle truss that solves', rowsT === 3 && !!$('#pgTrussRes .pg-status.good'), `rows ${rowsT}`);
  // rafters at 45°: -P/(2 sin45) = 7.071 kN compression, tie 5 kN tension
  const cellsN = [...D.querySelectorAll('#pgTrussRes tbody tr')].map((r) => r.cells[2].textContent.trim()).sort();
  check('built triangle: rafters 7.071 kN, tie 5 kN', cellsN.join(',') === '5,7.071,7.071', cellsN.join(','));
  $('[data-tool="del"]').click(); await sleep(40); tap(2.5, 2.5); await sleep(60);
  check('deleting a member makes it a mechanism', !!$('#pgTrussRes .pg-status.bad'));
  $('[data-tool="select"]').click(); await sleep(40);
  await go('#/learn'); await go('#/play');
  check('truss mode and scene are kept', !!$('#pgTruss') && D.querySelectorAll('#pgTrussRes .pg-status.bad').length === 1);
  $('[data-tpl="pratt"]').click(); await sleep(40);

  // 13. playground: fluids
  $('[data-mode="fluid"]').click(); await sleep(100);
  $('[data-act="sub"][data-v="buoy"]').click(); await sleep(60);
  $('[data-act="rhoF"][data-v="1000"]').click(); await sleep(40); $('[data-act="shape"][data-v="box"]').click(); await sleep(40); $('[data-act="rho"][data-v="917"]').click(); await sleep(40);
  check('fluid mode shows the buoyancy tank', !!$('#pgBuoy'));
  $('[data-act="release"]').click(); await sleep(900);
  check('ice released in water floats 91.7% submerged', $('#pgFlRes .pg-status.good')?.textContent.includes('91.7%'));
  const bb = $('#pgBuoy [data-body] .pg-hit'), br = bb.getBoundingClientRect();
  const pe3 = (type, el, y) => el.dispatchEvent(new W.PointerEvent(type, { bubbles: true, clientX: br.left + br.width / 2, clientY: y, pointerId: 13, isPrimary: true }));
  pe3('pointerdown', bb, br.top + br.height / 2); pe3('pointermove', $('#pgFlCanvas'), br.top + br.height / 2 - 30); pe3('pointerup', $('#pgFlCanvas'), br.top + br.height / 2 - 30); await sleep(80);
  check('lifting the body out needs a holding force', /\(למעלה\)/.test($('#pgFlRes').textContent) && !$('#pgFlRes').textContent.includes('כוח החזקה (למעלה)0 N'));
  $('[data-act="rho"][data-v="7850"]').click(); await sleep(40); $('[data-act="release"]').click(); await sleep(900);
  check('steel sinks to the bottom', !!$('#pgFlRes .pg-status.bad'));
  $('[data-act="sub"][data-v="pres"]').click(); await sleep(60); $('[data-act="top"][data-v="0"]').click(); await sleep(40); $('[data-act="rho2"][data-v="1000"]').click(); await sleep(40);
  const resTxt = $('#pgFlRes').textContent, m1 = resTxt.match(/בדיקה: F = ρ g h_c A = ([\d.]+) kN/), F1 = [...D.querySelectorAll('#pgFlRes .pg-max b')][4]?.textContent;
  check('gate force equals ρ g h_c A for one fluid', !!m1 && F1 && Math.abs(parseFloat(F1) - parseFloat(m1[1])) < 1e-9, `${F1} vs ${m1 && m1[1]}`);
  await go('#/learn'); await go('#/play');
  check('fluid mode and screen are kept', !!$('#pgPres'));

  // 14. playground: vibration
  $('[data-mode="vib"]').click(); await sleep(120);
  check('vibration mode shows the moving mass', !!$('#pgVib'));
  $('[data-preset="under"]').click(); await sleep(60);
  const tOf = () => parseFloat($('#pgVib').textContent.match(/t = ([\d.]+) s/)[1]);
  const ta = tOf(); await sleep(600); const tb = tOf();
  check('the simulation advances in real time', tb - ta > 0.3 && tb - ta < 1.2, `${ta} -> ${tb}`);
  check('ζ = 0.1 preset: underdamped, fn = 1.592 Hz', $('#pgVibRes .pg-status').textContent.includes('תת-קריטי') && $('#pgVibRes').textContent.includes('1.592 Hz'));
  $('[data-preset="res"]').click(); await sleep(60);
  check('resonance preset: M = 1/(2ζ) = 10', /מקדם הגברה M\s*10(?!\d)/.test($('#pgVibRes').innerText.replace(/\s+/g, ' ')));
  $('[data-act="play"]').click(); await sleep(40); const tc = tOf(); await sleep(400);
  check('pause stops the motion', tOf() === tc);
  const vmb = $('#pgVib [data-mass] .pg-hit'), mr = vmb.getBoundingClientRect();
  const pe4 = (type, el, y) => el.dispatchEvent(new W.PointerEvent(type, { bubbles: true, clientX: mr.left + mr.width / 2, clientY: y, pointerId: 15, isPrimary: true }));
  pe4('pointerdown', vmb, mr.top + mr.height / 2); pe4('pointermove', $('#pgVibCanvas'), mr.top + mr.height / 2 + 20); pe4('pointerup', $('#pgVibCanvas'), mr.top + mr.height / 2 + 20); await sleep(300);
  check('dragging and releasing the mass restarts the motion', tOf() > 0 && parseFloat($('#pgVibEdit [data-f="x0"]').value) > 0);
  $('[data-preset="crit"]').click(); await sleep(60);
  check('critical preset', $('#pgVibRes .pg-status').textContent.includes('קריטי') && !$('#pgVibRes .pg-status').textContent.includes('תת'));
  $('[data-mode="beam"]').click(); await sleep(60);

  const fails = log.filter((l) => l.startsWith('FAIL'));
  out.textContent = log.join('\n') + `\n\n${log.length - fails.length}/${log.length} passed`;
  document.title = fails.length ? 'FAIL' : 'PASS';
  } catch (e) { out.textContent = `ERROR ${e.message}\n${e.stack}\n\n${log.join('\n')}`; }
</script>
</body></html>
