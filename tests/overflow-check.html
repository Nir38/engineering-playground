<!doctype html>
<html><head><meta charset="utf-8"><title>overflow check</title></head>
<body style="margin:0;font:13px system-ui">
<!-- Loads every lesson in a 375px iframe and reports any element wider than the screen. -->
<pre id="out">running…</pre>
<iframe id="f" style="width:375px;height:800px;border:0"></iframe>
<script type="module">
  import { allDomains } from '../data/catalog.js';
  const out = document.getElementById('out'), fr = document.getElementById('f');
  const pages = [];
  allDomains().filter((d) => !d.soon).forEach((d) => d.subtopics.forEach((s) => pages.push(`#/learn/${d.id}/${s.id}`)));
  const lines = [];
  fr.src = '../index.html#/';
  await new Promise((r) => (fr.onload = r));
  await new Promise((r) => setTimeout(r, 400));
  for (const p of pages) {
    fr.contentWindow.location.hash = p;
    await new Promise((r) => setTimeout(r, 250));
    const doc = fr.contentDocument, W = doc.documentElement.clientWidth;
    const bad = [...doc.querySelectorAll('#view *')].filter((e) => { const b = e.getBoundingClientRect(); return b.width > 0 && (b.right > W + 1 || b.left < -1) && !e.closest('.eq, .step, .katex-display'); });
    if (bad.length || doc.documentElement.scrollWidth > W) lines.push(`OVERFLOW ${p}: ${bad.slice(0, 3).map((e) => e.tagName + '.' + e.className).join(', ')} sw=${doc.documentElement.scrollWidth}`);
  }
  out.textContent = `checked ${pages.length} pages\n` + (lines.join('\n') || 'NO OVERFLOW');
  document.title = lines.length ? 'FAIL' : 'PASS';
</script>
</body></html>
